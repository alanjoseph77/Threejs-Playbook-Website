<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Three.js Playground</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="../security.js"></script>


  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap');

    :root {
      --gray-700: #424242;
      --gray-500: #737373;
      --black: black;
      --border-radius--tiny: .375rem;
      --light-grey: #f4f4f4;
      --border-radius--xtiny: .25rem;
      --gray-800: #292929;
      --gray-25: #fcfcfc;
      --gray-400: #a3a3a3;
      --gray-50: #fafafa;
      --gray-900: #141414;
      --dark-green: #25fabe;
      --green: #61ffc9;
      --white: white;
      --border-radius--xlarge: 2rem;
      --border-radius--medium: 1.25rem;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      height: 100%;
      font-family: "Poppins", sans-serif;
      background-color: #f8f8f8;
    }

    .intro-wrapper {
      position: relative;
      height: 90vh;
      background-color: #f8f8f8;
    }

    .intro {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .text-align-center {
      max-width: 600px;
      text-align: center;
      position: absolute;
      top: 50px;
      will-change: transform, opacity;
    }

    .align-center {
      margin-left: auto;
      margin-right: auto;
    }

    .max-width-small {
      width: 100%;
      max-width: 30rem;
      padding: 0 1rem;
    }

    .margin-small {
      margin: 3.5rem;
      margin-bottom: 0;
    }

    .heading-style-h3 {
      letter-spacing: -.02em;
      font-size: 2.8125rem;
      font-weight: 500;
      line-height: 1;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .light-green-underline {
      box-shadow: inset 0 -0.5em 0 var(--green);
      display: inline;
    }

    p {
      color: var(--gray-500);
      margin-top: 1rem;
      margin-bottom: 0;
    }

    .text-size-medium {
      font-size: 1.125rem;
    }

    sup {
      top: -0.5em;
    }

    sub,
    sup {
      vertical-align: baseline;
      font-size: 75%;
      line-height: 0;
      position: relative;
    }

    .section_tabs {
      z-index: 2;
      border-radius: var(--border-radius--xlarge) var(--border-radius--xlarge) 0 0;
      background-color: var(--gray-800);
      position: relative;
    }

    .padding-section-large {
      padding: 5rem 2rem;
      position: relative;
    }

    .tabs_container {
      width: 100%;
      max-width: 120rem;
      margin-left: auto;
      margin-right: auto;
    }

    .tabs_component {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: stretch;
      justify-content: center;
    }

    /* --- Start of Card CSS --- */
    .card-container {
      width: 100%;
      min-height: 70vh;
      overflow: hidden;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background-color: #2a2a2e;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .example-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #ccc;
      font-size: 0.9rem;
    }

    #example-select {
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 0.5rem;
      font-size: 0.9rem;
      font-family: "Poppins", sans-serif;
    }

    .card-controls {
      display: flex;
      gap: 0.5rem;
    }

    .control-button {
      background-color: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-button:hover {
      background-color: #444;
    }

    .control-button#run-code {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    }

    .control-button#run-code:hover {
      background-color: #0056b3;
    }

    .card-body {
      display: flex;
      flex-grow: 1;
      overflow: hidden;
      padding: 0;
    }

    #code-input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.6;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }

    /* --- End of Card CSS --- */

    /* --- Preview Card CSS --- */
    .preview-card {
      background-color: #2a2a2e;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      min-height: 70vh;
      /* Made taller */
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .preview-header-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .preview-header-dot.red {
      background-color: #ff5f56;
    }

    .preview-header-dot.yellow {
      background-color: #ffbd2e;
    }

    .preview-header-dot.green {
      background-color: #27c93f;
    }

    .preview-address-bar {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: 'Fira Code', Courier, monospace;
      font-size: 14px;
      margin-bottom: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .preview-body {
      flex-grow: 1;
      background-color: #111;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #preview-container {
      width: 100%;
      height: 100%;
      color: #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }

    #preview-container canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* Responsive Styles */
    @media(max-width: 991px) {
      .tabs_component {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .padding-section-large {
        padding: 4rem 1rem;
      }
    }

    @media(max-width: 576px) {
      .heading-style-h3 {
        font-size: 2rem;
      }

      .padding-section-large {
        padding: 2rem 1rem;
      }

      .card-container,
      .preview-card {
        min-height: 60vh;
      }
    }
  </style>
</head>

<body>
  <div class="intro-wrapper">
    <div class="intro">
      <div class="text-align-center" id="js-pin">
        <div class="max-width-small align-center">
          <div class="margin-bottom margin-small">
            <h2 class="heading-style-h3"><span class="light-green-underline">Live</span> Three.js Editor</h2>
          </div>
          <p class="text-size-medium">
            Write Three.js code in the left panel and click "Run" to see your 3D creation come to life on the right.
          </p>
        </div>
      </div>
    </div>
  </div>

  <section class="section_tabs">
    <div class="padding-section-large">
      <div class="tabs_container">
        <div class="tabs_component">

          <!-- Interactive Code Editor Card -->
          <div class="card-container">
            <div class="card-header">
              <div class="example-selector">
                <label for="example-select">Load Example:</label>
                <select id="example-select">
                  <option value="">Select an example...</option>
                  <option value="basic-cube">Basic Rotating Cube</option>
                  <option value="colorful-spheres">Colorful Spheres</option>
                  <option value="particle-galaxy">Particle Galaxy</option>
                </select>
              </div>
              <div class="card-controls">
                <button id="reset-preview" class="control-button" title="Reset the preview canvas">Reset</button>
                <button id="run-code" class="control-button" title="Run the code (Ctrl+Enter)">Run Code</button>
              </div>
            </div>
            <div class="card-body">
              <textarea id="code-input" spellcheck="false"></textarea>
            </div>
          </div>

          <!-- Live Preview Card -->
          <div class="preview-card">
            <div class="preview-header">
              <div class="preview-header-dot red"></div>
              <div class="preview-header-dot yellow"></div>
              <div class="preview-header-dot green"></div>
            </div>
            <div class="preview-address-bar">
              Three.js Live Preview
            </div>
            <div class="preview-body" id="preview-container">
              Click "Run Code" to see your Three.js creation.
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>
  <div style="height:50vh; background-color: #f8f8f8;"></div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Pin the intro text section, but only on larger screens
    ScrollTrigger.matchMedia({
      "(min-width: 992px)": function () {
        ScrollTrigger.create({
          trigger: ".intro-wrapper",
          start: "top top",
          end: "bottom top",
          pin: "#js-pin",
          pinSpacing: false
        });
      }
    });

    // --- Three.js Playground Logic (adapted from playground.js) ---
    document.addEventListener('DOMContentLoaded', function () {
      initPlayground();
    });

    function initPlayground() {
      const codeInput = document.getElementById('code-input');
      const runButton = document.getElementById('run-code');
      const resetButton = document.getElementById('reset-preview');
      const previewContainer = document.getElementById('preview-container');

      if (!codeInput || !runButton || !previewContainer || !resetButton) {
        console.error("One or more required playground elements are missing.");
        return;
      }

      let currentRenderer = null;
      let currentAnimationId = null;

      const examples = {
        'basic-cube': `// Basic rotating cube
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 400 / 300, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const container = document.getElementById('preview-container');
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0); // Transparent background

// Create a cube
const geometry = new THREE.BoxGeometry();
const material = new THREE.MeshStandardMaterial({ 
    color: 0x61ffc9, // Theme green
    metalness: 0.1,
    roughness: 0.5
});
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

// Add some lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

camera.position.z = 5;

// Animation loop
function animate() {
    currentAnimationId = requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
}

animate();

// Make it responsive
window.addEventListener('resize', () => {
    const containerRect = container.getBoundingClientRect();
    renderer.setSize(containerRect.width, containerRect.height);
    camera.aspect = containerRect.width / containerRect.height;
    camera.updateProjectionMatrix();
});


// IMPORTANT: Return the renderer and the animation ID
return { renderer, animationId: currentAnimationId };`,

        'colorful-spheres': `// Colorful bouncing spheres with lighting
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 400 / 300, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const container = document.getElementById('preview-container');
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

// Add lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(10, 10, 10);
scene.add(pointLight);


// Create multiple spheres
const spheres = [];
const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];

for (let i = 0; i < 15; i++) {
    const geometry = new THREE.SphereGeometry(0.3, 32, 32);
    const material = new THREE.MeshStandardMaterial({ 
        color: colors[i % colors.length],
        roughness: 0.3,
        metalness: 0.2
    });
    const sphere = new THREE.Mesh(geometry, material);
    
    sphere.position.x = (Math.random() - 0.5) * 6;
    sphere.position.y = (Math.random() - 0.5) * 6;
    sphere.position.z = (Math.random() - 0.5) * 6;
    
    sphere.userData = {
        velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.02,
            (Math.random() - 0.5) * 0.02,
            (Math.random() - 0.5) * 0.02
        )
    };
    
    spheres.push(sphere);
    scene.add(sphere);
}

camera.position.z = 8;

function animate() {
    currentAnimationId = requestAnimationFrame(animate);
    
    spheres.forEach(sphere => {
        sphere.position.add(sphere.userData.velocity);
        
        // Bounce off boundaries
        if (Math.abs(sphere.position.x) > 4) sphere.userData.velocity.x *= -1;
        if (Math.abs(sphere.position.y) > 3) sphere.userData.velocity.y *= -1;
        if (Math.abs(sphere.position.z) > 4) sphere.userData.velocity.z *= -1;
    });
    
    renderer.render(scene, camera);
}

animate();

// Make it responsive
window.addEventListener('resize', () => {
    const containerRect = container.getBoundingClientRect();
    renderer.setSize(containerRect.width, containerRect.height);
    camera.aspect = containerRect.width / containerRect.height;
    camera.updateProjectionMatrix();
});

return { renderer, animationId: currentAnimationId };`,

        'particle-galaxy': `// Particle galaxy
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 400 / 300, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const container = document.getElementById('preview-container');
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

// Create particle system
const particleCount = 5000;
const particles = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);

const colorInside = new THREE.Color(0xff6633);
const colorOutside = new THREE.Color(0x3366ff);

for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const radius = Math.random() * 5;
    const spinAngle = radius * 3;
    const branchAngle = (i % 3) / 3 * Math.PI * 2;
    
    const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.2;
    const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.2;
    const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.2;

    positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
    positions[i3 + 1] = randomY;
    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;
    
    const mixedColor = colorInside.clone();
    mixedColor.lerp(colorOutside, radius / 5);

    colors[i3] = mixedColor.r;
    colors[i3 + 1] = mixedColor.g;
    colors[i3 + 2] = mixedColor.b;
}

particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
    size: 0.05,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
});

const particleSystem = new THREE.Points(particles, material);
scene.add(particleSystem);

camera.position.set(0, 3, 8);
camera.lookAt(0, 0, 0);

const clock = new THREE.Clock();

function animate() {
    const elapsedTime = clock.getElapsedTime();
    currentAnimationId = requestAnimationFrame(animate);
    particleSystem.rotation.y = elapsedTime * 0.1;
    renderer.render(scene, camera);
}

animate();

// Make it responsive
window.addEventListener('resize', () => {
    const containerRect = container.getBoundingClientRect();
    renderer.setSize(containerRect.width, containerRect.height);
    camera.aspect = containerRect.width / containerRect.height;
    camera.updateProjectionMatrix();
});

return { renderer, animationId: currentAnimationId };`
      };

      codeInput.value = examples['basic-cube'];

      // Run code functionality
      runButton.addEventListener('click', executeCode);

      // Reset preview functionality
      resetButton.addEventListener('click', resetPreview);

      // Auto-run on Ctrl+Enter
      codeInput.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          executeCode();
        }
      });

      function executeCode() {
        const code = codeInput.value;

        try {
          resetPreview();
          showPreviewMessage('Executing code...');

          setTimeout(() => {
            try {
              const result = executeThreeJSCode(code);

              previewContainer.innerHTML = '';

              if (result && result.renderer && result.renderer.domElement) {
                currentRenderer = result.renderer;
                currentAnimationId = result.animationId;

                previewContainer.appendChild(currentRenderer.domElement);
                showPreviewMessage('✅ Code executed successfully!', 'success');
              } else {
                throw new Error("The code must return an object like { renderer, animationId }.");
              }

            } catch (error) {
              showPreviewError(error.message);
            }
          }, 100);

        } catch (error) {
          showPreviewError(error.message);
        }
      }

      function executeThreeJSCode(code) {
        try {
          // To properly handle animation loops and cleanup, the user code
          // must store the animation frame id in a global scope accessible here.
          // We'll declare it here and the user code will assign to it.
          let currentAnimationId = null;

          const func = new Function('THREE', 'currentAnimationId', `
                    try {
                        ${code}
                    } catch (error) {
                        console.error('Execution Error:', error);
                        throw new Error('Execution Error: ' + error.message);
                    }
                `);

          return func(window.THREE, currentAnimationId);
        } catch (error) {
          throw error;
        }
      }

      function resetPreview() {
        if (currentAnimationId) {
          cancelAnimationFrame(currentAnimationId);
          currentAnimationId = null;
        }

        if (currentRenderer) {
          if (currentRenderer.dispose) {
            currentRenderer.dispose();
          }
          // Clean up scene resources more thoroughly
          if (currentRenderer.info.memory) {
            // This is a bit of a brute-force cleanup, might be too aggressive
            // depending on the scene structure, but good for a playground.
          }
          currentRenderer = null;
        }

        previewContainer.innerHTML = '';
        previewContainer.style.color = '#ccc';
        previewContainer.textContent = 'Click "Run Code" to see your Three.js creation';
      }

      function showPreviewMessage(message, type = 'info') {
        // Remove any existing messages
        const existingMsg = previewContainer.querySelector('.preview-message');
        if (existingMsg) existingMsg.remove();

        const colors = {
          info: '#00d4ff',
          success: '#4caf50',
          error: '#ff6b6b'
        };

        const color = colors[type] || colors.info;
        const messageDiv = document.createElement('div');
        messageDiv.className = 'preview-message';
        messageDiv.style.cssText = `
                color: ${color}; 
                text-align: center; 
                padding: 0.5rem 1rem; 
                font-size: 0.9rem;
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                border: 1px solid ${color};
                border-radius: 5px;
                z-index: 10;
                pointer-events: none;
            `;
        messageDiv.innerHTML = message;
        previewContainer.appendChild(messageDiv);

        if (type === 'success' || type === 'info') {
          setTimeout(() => {
            if (messageDiv.parentNode) {
              messageDiv.style.transition = 'opacity 0.5s';
              messageDiv.style.opacity = '0';
              setTimeout(() => messageDiv.remove(), 500);
            }
          }, 2000);
        }
      }

      function showPreviewError(error) {
        previewContainer.innerHTML = `<div style="color: #ff6b6b; text-align: left; padding: 2rem; line-height: 1.5; font-family: 'Poppins', sans-serif;">
                <i class="fas fa-exclamation-triangle" style="margin-right: 0.5rem; font-size: 1.2rem;"></i>
                <strong>Execution Error</strong>
                <div style="font-family: 'Fira Code', monospace; font-size: 0.8rem; margin-top: 1rem; background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 5px;">
                    ${error}
                </div>
            </div>`;
      }

      // Handle example selection
      const select = document.getElementById('example-select');
      if (select) {
        select.addEventListener('change', (e) => {
          const exampleKey = e.target.value;
          if (exampleKey && examples[exampleKey]) {
            codeInput.value = examples[exampleKey];
          }
        });
      }
    }

  </script>
</body>

</html>
