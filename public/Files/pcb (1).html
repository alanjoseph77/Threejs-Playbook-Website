<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D PCB Board with Moving Dot Animation</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333333;
            font-size: 14px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333333;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #333333;
            font-size: 12px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333333;
            max-width: calc(100vw - 40px);
        }

        #currentControls {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #333333;
            font-size: 12px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333333;
            max-width: calc(100vw - 40px);
        }

        #cameraPositionDisplay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            border-radius: 5px;
            z-index: 999;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-size: 14px;
            min-height: 44px;
            touch-action: manipulation;
        }

        button:hover, button:active {
            background: #0056b3;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            #controls {
                bottom: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                font-size: 11px;
                padding: 8px;
            }

            #controls p {
                margin: 4px 0;
                font-size: 10px;
            }

            #currentControls {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                padding: 8px;
            }

            #currentControls h4 {
                margin: 5px 0;
                font-size: 13px;
            }

            #cameraPositionDisplay {
                bottom: auto;
                top: 60px;
                right: 10px;
                font-size: 10px;
                padding: 6px;
            }

            button {
                padding: 8px 12px;
                font-size: 12px;
                margin: 3px;
                min-height: 40px;
            }
        }

        @media (max-width: 480px) {
            #controls {
                bottom: 5px;
                left: 5px;
                right: 5px;
                padding: 6px;
                font-size: 10px;
            }

            #controls p {
                font-size: 9px;
                margin: 3px 0;
            }

            #currentControls {
                top: 5px;
                right: 5px;
                left: 5px;
                padding: 6px;
            }

            #currentControls h4 {
                font-size: 12px;
                margin: 3px 0;
            }

            #cameraPositionDisplay {
                display: none;
            }

            button {
                padding: 6px 10px;
                font-size: 11px;
                margin: 2px;
                min-height: 38px;
            }
        }

        /* Landscape mobile orientation */
        @media (max-width: 896px) and (orientation: landscape) {
            #controls,
            #currentControls {
                font-size: 10px;
                padding: 5px;
            }

            #currentControls {
                max-width: 200px;
                right: 5px;
                left: auto;
            }

            #controls {
                max-width: 200px;
                left: 5px;
                bottom: 5px;
            }

            button {
                padding: 5px 8px;
                font-size: 10px;
                min-height: 32px;
            }

            #cameraPositionDisplay {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="container">
        

        <div id="controls">
            <p>🖱️ Mouse/Touch: Drag to rotate</p>
            <p>🔍 Scroll/Pinch: Zoom in/out</p>
            <p>🎯 Manual control only</p>
            <button onclick="toggleAutoRotate()" id="autoRotateBtn">Start Slideshow</button>
        </div>

        <div id="currentControls">
            <h4>Current Flow Controls</h4>
            <button onclick="toggleCurrentFlow()">Toggle Current Flow</button>
            <button onclick="increaseCurrentSpeed()">Speed +</button>
            <button onclick="decreaseCurrentSpeed()">Speed -</button>
            <p>Speed: <span id="speedDisplay">1.0x</span></p>
        </div>

        <div id="cameraPositionDisplay"
            style="position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); color: #0f0; padding: 10px; font-size: 12px; border-radius: 5px; z-index: 999;">
            Camera: <span id="camPos">x: 0, y: 0, z: 0</span>
            <div id="pcb"
                style="background: rgba(0,0,0,0.6); color: #0f0; padding: 10px; font-size: 12px; border-radius: 5px; margin-top: 5px;">
                PCB: <span id="camPos1">x: 0, y: 0, z: 0</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(0xffffff);
        document.getElementById('container').appendChild(renderer.domElement);
        const clock = new THREE.Clock();

        // Current flow animation variables
        let currentFlowActive = true;
        let currentSpeed = 1.0;
        let currentDots = [];
        
        // Animation state for continuous flow
        let globalOffset = 0;
        const totalDotCount = 30; // Total number of dots in the flow

        // Lighting setup
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.5, 50);
        pointLight.position.set(0, 8, 0);
        scene.add(pointLight);

        // PCB Group
        const pcbGroup = new THREE.Group();

        // Create PCB board base
        const boardGeometry = new THREE.BoxGeometry(26, 0.2, 11);
        const boardMaterial = new THREE.MeshPhongMaterial({
            color: 0x0d1b2a,
            shininess: 30
        });
        const board = new THREE.Mesh(boardGeometry, boardMaterial);
        board.receiveShadow = true;
        pcbGroup.add(board);

        function createIC(x, y, z, rotationY = 1.6, label = "U1") {
            const icGroup = new THREE.Group();

            // Create a canvas texture for the top label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a1a1a'; // background matches chip color
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 42px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, canvas.width / 2, canvas.height / 2);

            const textTexture = new THREE.CanvasTexture(canvas);
            textTexture.minFilter = THREE.LinearFilter;

            // Create materials: top face uses the label texture
            const materials = [
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // right
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // left
                new THREE.MeshPhongMaterial({ map: textTexture }), // top face with label ✅
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // bottom
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // front
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a })  // back
            ];

            const bodyGeometry = new THREE.BoxGeometry(1, 0.3, 1);
            const body = new THREE.Mesh(bodyGeometry, materials);
            icGroup.add(body);

            // Pins - 8 per side
            const pinGeometry = new THREE.BoxGeometry(0.08, 0.7, 0.03);
            const pinMaterial = new THREE.MeshPhongMaterial({ color: 0xc0c0c0 });

            for (let i = 0; i < 8; i++) {
                const pinL = new THREE.Mesh(pinGeometry, pinMaterial);
                pinL.position.set(-0.4, -0.5, -0.48 + i * 0.13);
                icGroup.add(pinL);

                const pinR = new THREE.Mesh(pinGeometry, pinMaterial);
                pinR.position.set(0.4, -0.5, -0.48 + i * 0.13);
                icGroup.add(pinR);
            }

            icGroup.position.set(x, y, z);
            icGroup.rotation.y = rotationY;
            icGroup.castShadow = true;

            return icGroup;
        }

        function createIC1(x, y, z, rotationY = 1.6, label = "U1") {
            const icGroup = new THREE.Group();

            canvas.width = 246;
            canvas.height = 256;

            const materials = [
                new THREE.MeshPhongMaterial({ color: 0xC0C0C0 }), // right
                new THREE.MeshPhongMaterial({ color: 0xC0C0C0 }), // left
                new THREE.MeshPhongMaterial({ map: textTexture }), // top face with label ✅
                new THREE.MeshPhongMaterial({ color: 0xC0C0C0 }), // bottom
                new THREE.MeshPhongMaterial({ color: 0xC0C0C0 }), // front
                new THREE.MeshPhongMaterial({ color: 0xC0C0C0 })  // back

            const bodyGeometry = new THREE.BoxGeometry(1.5, 0.2, 2.5);
            const body = new THREE.Mesh(bodyGeometry, materials);
            icGroup.add(body);

            icGroup.position.set(x, y, z);
            icGroup.rotation.y = rotationY;
            icGroup.castShadow = true;

            return icGroup;
        }

        function createIC2(x, y, z, rotationY = 1.6, label = "U1", labelRotationDeg = 90) {
            const icGroup = new THREE.Group();

            // Create a canvas texture for the top label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a1a1a'; // match chip color
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rotate the text on canvas
            const angle = labelRotationDeg * Math.PI / 180; // degrees to radians
            ctx.translate(canvas.width / 2, canvas.height / 2); // move to center
            ctx.rotate(angle); // rotate canvas
            ctx.fillStyle = 'white';
            ctx.font = 'bold 42px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, 0); // draw at center after rotation
            ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform

            const textTexture = new THREE.CanvasTexture(canvas);
            textTexture.minFilter = THREE.LinearFilter;

            // Create materials: top face uses the label texture
            const materials = [
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // right
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // left
                new THREE.MeshPhongMaterial({ map: textTexture }), // top face with label ✅
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // bottom
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a }), // front
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a })  // back
            ];

            const bodyGeometry = new THREE.BoxGeometry(1, 0.3, 1);
            const body = new THREE.Mesh(bodyGeometry, materials);
            icGroup.add(body);

            // Pins - 4 per side
            const pinGeometry = new THREE.BoxGeometry(0.08, 0.7, 0.03);
            const pinMaterial = new THREE.MeshPhongMaterial({ color: 0xc0c0c0 });

            for (let i = 0; i < 4; i++) {
                const pinL = new THREE.Mesh(pinGeometry, pinMaterial);
                pinL.position.set(-0.4, -0.5, -0.20 + i * 0.11);
                icGroup.add(pinL);

                const pinR = new THREE.Mesh(pinGeometry, pinMaterial);
                pinR.position.set(0.4, -0.5, -0.20 + i * 0.11);
                icGroup.add(pinR);
            }

            icGroup.position.set(x, y, z);
            icGroup.rotation.y = rotationY;
            icGroup.castShadow = true;
            icGroup.scale.set(0.7, 0.7, 0.7);
            return icGroup;
        }

        function createSMD(x, y, z, label = '', rotationY = 1.5) {
            const smdGroup = new THREE.Group();

            // Green PCB Pad
            const padGeometry = new THREE.BoxGeometry(1.2, 0.05, 0.6);
            const padMaterial = new THREE.MeshPhongMaterial({ color: 0x3e7d3e });
            const pad = new THREE.Mesh(padGeometry, padMaterial);
            pad.position.set(0, -0.075, 0);
            smdGroup.add(pad);

            // Yellow solder pads
            const padSize = [0.3, 0.1, 0.6];
            const yellowMaterial = new THREE.MeshPhongMaterial({ color: 0xffd700 });

            const leftPad = new THREE.Mesh(new THREE.BoxGeometry(...padSize), yellowMaterial);
            leftPad.position.set(-0.45, 0, 0);
            smdGroup.add(leftPad);

            const rightPad = new THREE.Mesh(new THREE.BoxGeometry(...padSize), yellowMaterial);
            rightPad.position.set(0.45, 0, 0);
            smdGroup.add(rightPad);

            // White terminals
            const terminalSize = [0.2, 0.2, 0.6];
            const whiteMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });

            const leftTerminal = new THREE.Mesh(new THREE.BoxGeometry(...terminalSize), whiteMaterial);
            leftTerminal.position.set(-0.3, 0.1, 0);
            smdGroup.add(leftTerminal);

            const rightTerminal = new THREE.Mesh(new THREE.BoxGeometry(...terminalSize), whiteMaterial);
            rightTerminal.position.set(0.3, 0.1, 0);
            smdGroup.add(rightTerminal);

            // Brown body
            const bodyGeometry = new THREE.BoxGeometry(0.4, 0.2, 0.6);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xA0522D });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.set(0, 0.1, 0);
            smdGroup.add(body);

            // Set position, rotation, scale
            smdGroup.position.set(x, y, z);
            smdGroup.rotation.y = rotationY; // 🔁 Manual rotation (Y-axis)
            smdGroup.castShadow = true;
            smdGroup.scale.set(0.3, 0.3, 0.3); // scale down

            return smdGroup;
        }

        function createSMD_Black(x, y, z, label = '', rotationY = 1.5, scale = 0.3) {
            const smdGroup = new THREE.Group();

            // Green PCB Pad
            const padGeometry = new THREE.BoxGeometry(1.2, 0.05, 0.6);

        }

            const smdGroup = new THREE.Group();

            // Green PCB Pad
            const padGeometry = new THREE.BoxGeometry(1.2, 0.05, 0.6);

        }

        function createPinHeader(x = 0, y = 0, z = 0, scale = 0.2, rotationY = 0) {
            const group = new THREE.Group();

            // Main rectangular slot (black header)
            const bodyGeometry = new THREE.BoxGeometry(0.4, 0.05, 5.2);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x222222 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            group.add(body);

            // Hole style: realistic ring (torus) + inner cutout
            const ringMaterial = new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 100 });
            const holeZStart = -1.5;

            for (let i = 0; i < 12; i++) {
                const zOffset = holeZStart + i * 0.4;

                // Outer ring (via/pad)
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(0.06, 0.01, 8, 16),
                    ringMaterial
                );
                ring.rotation.x = Math.PI / 2;
                ring.position.set(0, 0.026, zOffset - 0.7);
                group.add(ring);
            }

            group.position.set(x, y, z);
            group.rotation.y = rotationY;
            group.scale.set(scale, scale, scale);

            return group;
        }

        function createPinHeader1(x = 0, y = 0, z = 0, scale = 0.2, rotationY = 0) {
            const group = new THREE.Group();

            const ringMaterial = new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 100 });
            const pinMaterial = new THREE.MeshPhongMaterial({ color: 0xb87333, shininess: 80 });

            const holeZStart = -1.5;
            const pinHeight = 0.1;
            const pinRadius = 0.010;

            for (let i = 0; i < 8; i++) {
                const zOffset = holeZStart + i * 0.1 - 0.7;

                // Torus ring
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(0.03, 0.01, 8, 16),
                    ringMaterial
                );
                ring.rotation.x = Math.PI / 2;
                ring.position.set(0, 0.026, zOffset);
                group.add(ring);

                // Vertical pin
                const pin = new THREE.Mesh(
                    new THREE.CylinderGeometry(pinRadius, pinRadius, pinHeight, 12),
                    pinMaterial
                );
                pin.position.set(0, 0.096 - pinHeight / 2, zOffset);
                group.add(pin);
            }

            group.position.set(x, y, z);
            group.rotation.y = rotationY;
            group.scale.set(scale, scale, scale);

            return group;
        }

        function createPinHeader2(x = 0, y = 0, z = 0, scale = 0.2, rotationY = 0) {

        }

        function createPinHeader3(x = 0, y = 0, z = 0, scale = 0.2, rotationY = 0) {
            const group = new THREE.Group();

            const ringMaterial = new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 100 });
            const pinMaterial = new THREE.MeshPhongMaterial({ color: 0xb87333, shininess: 80 });

            const holeZStart = -1.5;
            const pinHeight = 0.1;
            const pinRadius = 0.010;

            for (let i = 0; i < 3; i++) {
                const zOffset = holeZStart + i * 0.2 - 0.7;

                // Torus ring
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(0.05, 0.01, 8, 16),
                    ringMaterial
                );
                ring.rotation.x = Math.PI / 2;
                ring.position.set(0, 0.026, zOffset);
                group.add(ring);

                // Vertical pin
                const pin = new THREE.Mesh(
                    new THREE.CylinderGeometry(pinRadius, pinRadius, pinHeight, 12),
                    pinMaterial
                );
                pin.position.set(0, 0.096 - pinHeight / 2, zOffset);
                group.add(pin);
            }

            { text: "1LW", pos: { x: 1.5, y: 0.101, z: -5.42 } }
        ];

        labels.forEach(labelData => {
            pcbGroup.add(createPCBLabel({
                text: labelData.text,
                position: labelData.pos,
                rotation: { x: -Math.PI / 2, y: 0, z: Math.PI / 2 },
                size: { width: 0.6, height: 0.5 },
                fontSize: 50
            }));

            pcbGroup.add(createPCBLabel({
                text: "V2",
                position: { x: -2.6, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));
            pcbGroup.add(createPCBLabel({
                text: "W2",
                position: { x: -2.35, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));


            pcbGroup.add(createPCBLabel({
                text: "V2",
                position: { x: -1.9, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));
            pcbGroup.add(createPCBLabel({
                text: "U2",
                position: { x: -1.65, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));
            pcbGroup.add(createPCBLabel({
                text: "V1",
                position: { x: 0.01, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));
            pcbGroup.add(createPCBLabel({
                text: "W1",
                position: { x: 0.2, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));

            pcbGroup.add(createPCBLabel({
                text: "U1",
                position: { x: 0.8, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));
            pcbGroup.add(createPCBLabel({
                text: "V1",
                position: { x: 1, y: 0.101, z: 5.45 }, // front-left
                rotation: { x: -Math.PI / 2, y: 0, z: 0 },
                size: { width: 1, height: 0.3 }
            }));
        });

        // Add pin headers
        const pinHeaders = [
            { func: createPinHeader1, pos: [4.3, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader1, pos: [0.6, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [4, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [3.7, 0.084, 0.13, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [3.4, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [3.1, 0.084, 0.13, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [2.8, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [0.2, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [-0.1, 0.084, 0.13, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [-0.4, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [-0.7, 0.084, 0.13, 0.8, Math.PI / 2] },
            { func: createPinHeader2, pos: [-1.0, 0.074, -0.01, 0.8, Math.PI / 2] },
            { func: createPinHeader3, pos: [0.8, 0.074, 1.65, 0.8, Math.PI / 2] },
            { func: createPinHeader3, pos: [4.5, 0.074, 1.65, 0.8, Math.PI / 2] },
            { func: createPinHeader4, pos: [2.7, 0.074, 1.65, 0.8, Math.PI / 2] },
            { func: createPinHeader4, pos: [-1, 0.074, 1.65, 0.8, Math.PI / 2] }
        ];

        pinHeaders.forEach(header => {
            pcbGroup.add(header.func(...header.pos));
        });

        pcbGroup.add(createScrewTerminal(-1.8, 0.099, 5.3, 1, Math.PI));
        pcbGroup.add(createScrewTerminal(-2.5, 0.099, 5.3, 1, Math.PI));
        pcbGroup.add(createScrewTerminal(0.1, 0.099, 5.3, 1, Math.PI));
        pcbGroup.add(createScrewTerminal(0.9, 0.099, 5.3, 1, Math.PI));

        // === Animated Arrows for Pin Headers ===
        const arrowTargets = [
            { label: "2HU", pos: { x: -1.68, y: 0.101, z: -5.42 } },
            { label: "2HV", pos: { x: -1.34, y: 0.101, z: -5.42 } },
            { label: "2HW", pos: { x: -0.999, y: 0.101, z: -5.42 } },
            { label: "2LU", pos: { x: -0.70, y: 0.101, z: -5.42 } }
        ];
        const arrowMeshes = [];
        arrowTargets.forEach(target => {
            // Arrow shaft
            const shaftGeometry = new THREE.CylinderGeometry(0.025, 0.025, 0.18, 12);
            const shaftMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
            shaft.position.set(0, -0.22, -0.2);
            // Arrow head
            const headGeometry = new THREE.ConeGeometry(0.06, 0.12, 16);
            const headMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(0, -0.1, -0.2);
            // Group
            const arrowGroup = new THREE.Group();
            arrowGroup.add(shaft);
            arrowGroup.add(head);
            // Position so arrow head tip is just above the top of the hole
            arrowGroup.position.set(target.pos.x, target.pos.y - 0.01 - 0.3, target.pos.z);
            arrowGroup.rotation.x = -Math.PI; // point downwards
            pcbGroup.add(arrowGroup);
            arrowMeshes.push(arrowGroup);
        });

        // Initialize current flow animation
        initCurrentFlowAnimation();

        // Camera position
        camera.position.set(5.73, 3.82, 5.73);
        camera.lookAt(0, 0, 0);
        pcbGroup.rotation.set(-0.04, -1.81, 0);

        // Mouse and Touch controls
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let mouseDown = false;

        // Track pinch-to-zoom
        let initialPinchDistance = 0;
        let isPinching = false;

        // Mouse events
        document.addEventListener('mousedown', (event) => {
            if (autoRotate) return; // Disable manual while auto-rotating
            mouseDown = true;
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        document.addEventListener('mouseup', () => {
            if (autoRotate) return;
            mouseDown = false;
        });

        document.addEventListener('mousemove', (event) => {
            if (autoRotate) return;
            if (mouseDown) {
                const deltaX = event.clientX - mouseX;
                const deltaY = event.clientY - mouseY;

                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;

                mouseX = event.clientX;
                mouseY = event.clientY;
            }
        });

        // Touch events for mobile
        document.addEventListener('touchstart', (event) => {
            if (autoRotate) return;

            if (event.touches.length === 1) {
                // Single touch - rotation
                mouseDown = true;
                mouseX = event.touches[0].clientX;
                mouseY = event.touches[0].clientY;
            } else if (event.touches.length === 2) {
                // Two finger touch - pinch to zoom
                isPinching = true;
                mouseDown = false;
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: false });

        document.addEventListener('touchmove', (event) => {
            if (autoRotate) return;
            event.preventDefault();

            if (isPinching && event.touches.length === 2) {
                // Handle pinch zoom
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (initialPinchDistance > 0) {
                    const scale = distance / initialPinchDistance;
                    camera.position.multiplyScalar(2 - scale);
                    initialPinchDistance = distance;
                }
            } else if (mouseDown && event.touches.length === 1) {
                // Handle rotation
                const touch = event.touches[0];
                const deltaX = touch.clientX - mouseX;
                const deltaY = touch.clientY - mouseY;

                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;

                mouseX = touch.clientX;
                mouseY = touch.clientY;
            }
        }, { passive: false });

        document.addEventListener('touchend', (event) => {
            if (autoRotate) return;

            if (event.touches.length === 0) {
                mouseDown = false;
                isPinching = false;
                initialPinchDistance = 0;
            } else if (event.touches.length === 1) {
                // Switched from pinch to single touch
                isPinching = false;
                mouseDown = true;
                mouseX = event.touches[0].clientX;
                mouseY = event.touches[0].clientY;
            }
        });

        // Zoom with mouse wheel
        document.addEventListener('wheel', (event) => {
            camera.position.multiplyScalar(1 + event.deltaY * 0.001);
        });

        // Animation loop
        renderer.setAnimationLoop(() => {
            const delta = Math.min(clock.getDelta(), 0.1);

            // PCB rotation when dragging mouse
            if (!autoRotate && mouseDown) {
                pcbGroup.rotation.y += (targetRotationY - pcbGroup.rotation.y) * 0.1;
                pcbGroup.rotation.x += (targetRotationX - pcbGroup.rotation.x) * 0.1;
            }

            // Auto-rotation (slideshow)
            if (autoRotate) {
                autoRotateTimer += delta;
                if (autoRotateTimer > 3) { // Change angle every 3 seconds
                    autoRotateIndex = (autoRotateIndex + 1) % autoRotateAngles.length;
                    autoRotateTimer = 0;
                }
                // Smoothly interpolate to the target angle
                const target = autoRotateAngles[autoRotateIndex];
                pcbGroup.rotation.x += (target.x - pcbGroup.rotation.x) * 0.05;
                pcbGroup.rotation.y += (target.y - pcbGroup.rotation.y) * 0.05;
                pcbGroup.rotation.z += (target.z - pcbGroup.rotation.z) * 0.05;
                // Also update targetRotationX/Y so manual resumes from current
                targetRotationX = pcbGroup.rotation.x;
                targetRotationY = pcbGroup.rotation.y;
            }

            // Update continuous current flow animation
            updateCurrentFlow(delta);

            // Update camera position in the UI
            const pos = camera.position;
            document.getElementById('camPos').textContent =
                `x: ${pos.x.toFixed(2)}, y: ${pos.y.toFixed(2)}, z: ${pos.z.toFixed(2)}`;

            document.getElementById('camPos1').textContent =
                `x: ${pcbGroup.rotation.x.toFixed(2)}, y: ${pcbGroup.rotation.y.toFixed(2)}, z: ${pcbGroup.rotation.z.toFixed(2)}`;

            // Animate LED glow
            const time = Date.now() * 0.001;
            pointLight.intensity = 0.5 + Math.sin(time * 2) * 0.3;

            // Animate arrows (up and down motion)
            arrowMeshes.forEach((arrow, i) => {
                arrow.position.y = arrowTargets[i].pos.y + 0.08 + Math.sin(time * 2 + i) * 0.07;
            });

            // Render scene
            renderer.render(scene, camera);
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
