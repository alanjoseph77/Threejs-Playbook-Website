<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire Fruit Basket</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #333;
            pointer-events: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #daa520;
            font-size: 1.2rem;
            font-family: monospace;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Bending Wires...</div>
    <div id="info">Gold Fruit Basket Model<br></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Dimensions from Blueprint ---
        const DIMS = {
            height: 120,
            topRadius: 90,
            baseRadius: 40,   // D80
            neckRadius: 17.25, // D34.5
            neckHeight: 35,    // Visual approximation from Section A-A
            
            ringThickness: 2.5, // Radius of ring tube (Diameter 5)
            wireRadius: 0.6,    // Radius of wire (Diameter 1.2)
            
            numWires: 48,       // Count based on visual density
            twistAngle: Math.PI / 1.5 // Amount of spiral twist from bottom to top
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // Clean white background like the render
        
        // Floor shadow plane
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.ShadowMaterial({ opacity: 0.1 })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = 0;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 100, 250);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 60, 0); // Look at center of basket height

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(100, 150, 100);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(2048, 2048);
        mainLight.shadow.camera.left = -150;
        mainLight.shadow.camera.right = 150;
        mainLight.shadow.camera.top = 150;
        mainLight.shadow.camera.bottom = -150;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xffeeb1, 0.5); // Warm fill
        fillLight.position.set(-100, 50, -100);
        scene.add(fillLight);

        // --- Material ---
        const materialGold = new THREE.MeshPhysicalMaterial({
            color: 0xffd700,    // Gold
            metalness: 1.0,
            roughness: 0.25,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
        });

        const basketGroup = new THREE.Group();
        scene.add(basketGroup);

        // --- Geometry Construction ---

        // 1. Top Ring
        const topRingGeo = new THREE.TorusGeometry(DIMS.topRadius, DIMS.ringThickness, 16, 100);
        const topRing = new THREE.Mesh(topRingGeo, materialGold);
        topRing.rotation.x = Math.PI / 2;
        topRing.position.y = DIMS.height;
        topRing.castShadow = true;
        basketGroup.add(topRing);

        // 2. Base Ring
        const baseRingGeo = new THREE.TorusGeometry(DIMS.baseRadius, DIMS.ringThickness, 16, 64);
        const baseRing = new THREE.Mesh(baseRingGeo, materialGold);
        baseRing.rotation.x = Math.PI / 2;
        baseRing.position.y = DIMS.ringThickness; // Sit on floor
        baseRing.castShadow = true;
        basketGroup.add(baseRing);

        // 3. Wires Generation
        // We need a curve that defines the profile radius at any given Height Y.
        // We use a SplineCurve for the radius profile R(y).
        
        // Profile Control Points (Height, Radius)
        // 0, 40 (Base)
        // 35, 17.25 (Neck pinch)
        // 120, 90 (Top)
        
        // We'll create a CatmullRomCurve3 for a single wire first, then clone/rotate.
        const wirePoints = [];
        const segments = 20;
        
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const h = t * DIMS.height; // Current height
            
            // Calculate Radius at height h using a custom interpolation
            // We use a Bezier-like logic or just math function to get the hourglass shape.
            // Let's interpret the "Spline" visually:
            // It curves sharply in at bottom, straightens out at top.
            
            let r;
            if (h < DIMS.neckHeight) {
                // Bottom section: 40 -> 17.25
                // Using a quadratic ease-out to pinch in
                const tLocal = h / DIMS.neckHeight;
                // Simple Linear lerp is too sharp. Let's use Cosine interpolation.
                // 0 -> 1
                const k = (1 - Math.cos(tLocal * Math.PI)) / 2; // Smooth S
                // Actually, let's just use cubic interpolation manually or three's curve.
                // Let's use a 2D SplineCurve for radius to be precise.
                r = THREE.MathUtils.lerp(DIMS.baseRadius, DIMS.neckRadius, Math.sqrt(tLocal)); // convex curve?
            } else {
                // Top section: 17.25 -> 90
                const tLocal = (h - DIMS.neckHeight) / (DIMS.height - DIMS.neckHeight);
                // Parabolic flare
                r = THREE.MathUtils.lerp(DIMS.neckRadius, DIMS.topRadius, tLocal * tLocal); 
            }

            // Adjust profile using specific control points for better shape match
            // Creating a 2D curve for Radius vs Height
        }

        // Better Approach: Define the 3D curve directly
        const curvePath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(DIMS.baseRadius, DIMS.ringThickness, 0), // Start
            new THREE.Vector3(DIMS.neckRadius * 1.5, DIMS.neckHeight * 0.5, 0), // Base Transition
            new THREE.Vector3(DIMS.neckRadius, DIMS.neckHeight, 0), // Neck (Pinch)
            new THREE.Vector3(DIMS.neckRadius * 1.2, DIMS.neckHeight + 15, 0), // Neck Exit
            new THREE.Vector3(60, 90, 0), // Mid flare
            new THREE.Vector3(DIMS.topRadius, DIMS.height, 0) // Top
        ]);

        // Now we need to generate points from this curve, BUT add the spiral twist.
        // We can't just rotate the mesh, we need to displace the vertices or points.
        
        const generatedPoints = [];
        const curveDivisions = 60;
        
        for (let i = 0; i <= curveDivisions; i++) {
            const t = i / curveDivisions;
            const point = curvePath.getPoint(t);
            
            // Point is currently on X-Y plane (Z=0).
            // Radius is point.x
            // Height is point.y
            
            const radius = point.x;
            const height = point.y;
            
            // Calculate Twist Angle
            // Linear twist from bottom to top
            const currentTwist = t * DIMS.twistAngle;
            
            // Convert polar to cartesian
            const x = radius * Math.cos(currentTwist);
            const z = radius * Math.sin(currentTwist);
            
            generatedPoints.push(new THREE.Vector3(x, height, z));
        }
        
        const twistedCurve = new THREE.CatmullRomCurve3(generatedPoints);
        
        // Create Geometry for ONE wire
        const wireGeo = new THREE.TubeGeometry(twistedCurve, 64, DIMS.wireRadius, 8, false);
        const wireMesh = new THREE.Mesh(wireGeo, materialGold);
        wireMesh.castShadow = true;
        
        // Instance the wires radially
        // InstancedMesh is much more performant than 48 individual meshes
        const instancedWires = new THREE.InstancedMesh(wireGeo, materialGold, DIMS.numWires);
        instancedWires.castShadow = true;
        instancedWires.receiveShadow = true;
        
        const dummy = new THREE.Object3D();
        
        for (let i = 0; i < DIMS.numWires; i++) {
            const angle = (i / DIMS.numWires) * Math.PI * 2;
            dummy.rotation.set(0, angle, 0); // Rotate around Y axis
            dummy.position.set(0, 0, 0);
            dummy.updateMatrix();
            instancedWires.setMatrixAt(i, dummy.matrix);
        }
        
        basketGroup.add(instancedWires);

        // --- Render Loop ---
        document.getElementById('loading').style.display = 'none';

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
