<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squirrel Cage Rotor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
        }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>
    <div id="controls">
        <button onclick="toggleRotation()">Start/Stop Rotation</button>
        <button onclick="toggleWireframe()">Toggle Wireframe</button>
        <button onclick="resetView()">Reset View</button>
        <button onclick="toggleGizmo()">Toggle Gizmo</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script>
        // Global variables
        let isRotating = false;
        let rotorGroup;
        let wireframeMode = false;
        let allMeshes = [];
        let transformControls;
        let gizmoEnabled = false;

        // Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x1e3c72, 50, 200);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75, window.innerWidth / window.innerHeight, 0.6, 5000
        );
        camera.position.set(15, 10, 15);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(0xe8e8e8);
        document.body.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.enablePan = true;
        controls.minDistance = 5;
        controls.maxDistance = 100;

        // Materials
        const rotorCoreMaterial = new THREE.MeshPhongMaterial({
            color: 0x7f8c8d,
            shininess: 60
        });

        const aluminumMaterial = new THREE.MeshPhongMaterial({
            color: 0xC0C0C0,
            shininess: 80,
            reflectivity: 0.9
        });

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-10, 5, -10);
        backLight.castShadow = true;
        scene.add(backLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
        pointLight.position.set(-10, 10, 10);
        scene.add(pointLight);

        // Create professional squirrel cage rotor
        function createSquirrelCageRotor() {
            rotorGroup = new THREE.Group();

            // Rotor core
            const coreGeometry = new THREE.CylinderGeometry(3.3, 3.3, 0.5, 32);
            const coreMaterial = new THREE.MeshPhongMaterial({
                color: 0x7f8c8d,
                shininess: 60
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            core.castShadow = true;
            core.receiveShadow = true;
            core.position.y = -4.3;
            allMeshes.push(core);

            const core2 = new THREE.Mesh(coreGeometry, coreMaterial);
            core2.castShadow = true;
            core2.receiveShadow = true;
            core2.position.y = 4.3;
            allMeshes.push(core2);

            // // Laminations
            // for (let i = 0; i < 45; i++) {
            //     const lamination = new THREE.Mesh(
            //         new THREE.CylinderGeometry(2.82, 2.82, 0.03, 32),
            //         new THREE.MeshPhongMaterial({ color: 0x95a5a6, shininess: 80 })
            //     );
            //     lamination.position.y = -4.5 + (i * 0.2);
            //     lamination.castShadow = true;
            //     core.add(lamination);
            //     allMeshes.push(lamination);
            // }

            const barCount = 28;
            const barRadius = 3.1;
            const slotRadius = 3.2;

            for (let i = 0; i < barCount; i++) {
                const angleTop = (i / barCount) * Math.PI * 2;
                const angleBottom = ((i + 1) % barCount) / barCount * Math.PI * 2;

                // Bar top and bottom points
                const top = new THREE.Vector3(
                    Math.cos(angleTop) * barRadius,
                    4.65,
                    Math.sin(angleTop) * barRadius
                );
                const bottom = new THREE.Vector3(
                    Math.cos(angleBottom) * barRadius,
                    -4.65,
                    Math.sin(angleBottom) * barRadius
                );

                const barMid = new THREE.Vector3().addVectors(top, bottom).multiplyScalar(0.5);
                const direction = new THREE.Vector3().subVectors(top, bottom);
                const length = direction.length();

                const barGeometry = new THREE.CylinderGeometry(0.10, 0.12, length, 8);
                barGeometry.translate(0, length / 2, 0);

                const bar = new THREE.Mesh(barGeometry, aluminumMaterial);
                const barQuat = new THREE.Quaternion();
                barQuat.setFromUnitVectors(new THREE.Vector3(0, 1.021, 0), direction.clone().normalize());
                bar.applyQuaternion(barQuat);
                bar.position.copy(barMid);
                bar.position.y += -4.65;
                bar.castShadow = true;
                rotorGroup.add(bar);
                allMeshes.push(bar);

                // Slot top and bottom points (slightly offset)
                const slotTop = new THREE.Vector3(
                    Math.cos(angleTop) * slotRadius,
                    3.5,
                    Math.sin(angleTop) * slotRadius
                );
                const slotBottom = new THREE.Vector3(
                    Math.cos(angleBottom) * slotRadius,
                    -3.5,
                    Math.sin(angleBottom) * slotRadius
                );

                
            }

            // Shaft
            const shaft = new THREE.Mesh(
                new THREE.CylinderGeometry(0.8, 0.8, 16, 15),
                new THREE.MeshPhongMaterial({ color: 0x444444, shininess: 100 })
            );
            shaft.castShadow = true;
            rotorGroup.add(shaft);
            allMeshes.push(shaft);

            rotorGroup.add(core);
            rotorGroup.add(core2);

            return rotorGroup;
        }

        // Create and add squirrel cage rotor
        const rotor = createSquirrelCageRotor();
        rotor.rotation.x = 1.6;
        scene.add(rotor);

        // Add TransformControls (Gizmo)
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.attach(rotor);
        transformControls.setMode('translate');
        transformControls.enabled = false;
        scene.add(transformControls);

        // Disable OrbitControls when using TransformControls
        transformControls.addEventListener('dragging-changed', function (event) {
            controls.enabled = !event.value;
        });

        // Control functions
        function toggleRotation() {
            isRotating = !isRotating;
        }

        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            allMeshes.forEach(mesh => {
                if (mesh.material) {
                    mesh.material.wireframe = wireframeMode;
                }
            });
        }

        function resetView() {
            camera.position.set(15, 10, 15);
            controls.reset();
        }

        function toggleGizmo() {
            gizmoEnabled = !gizmoEnabled;
            transformControls.enabled = gizmoEnabled;
            transformControls.visible = gizmoEnabled;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Rotate rotor if enabled
            if (isRotating && rotorGroup) {
                rotorGroup.rotation.y += 0.02;
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>

</body>

</html>
