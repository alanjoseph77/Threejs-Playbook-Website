<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Extrusion with Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 1rem;
            background-color: rgba(17, 24, 39, 0.8); /* bg-gray-900 with opacity */
            color: white;
            border-radius: 0.5rem; /* rounded-lg */
            max-width: 300px;
            font-size: 0.875rem; /* text-sm */
            border: 1px solid rgba(55, 65, 81, 0.8); /* border-gray-700 */
        }
        canvas {
            display: block;
        }
        /* Style for lil-gui */
        .lil-gui.root {
            --widget-color: #d1d5db; /* gray-300 */
            --background-color: rgba(17, 24, 39, 0.8); /* bg-gray-900 with opacity */
            --title-background-color: #374151; /* gray-700 */
            --title-text-color: #f9fafb; /* gray-50 */
            --hover-color: #4b5563; /* gray-600 */
            --focus-color: #6b7280; /* gray-500 */
            --number-color: #60a5fa; /* blue-400 */
            --string-color: #a78bfa; /* violet-400 */
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="info">
        <h1 class="text-lg font-bold text-gray-100 mb-2">ExtrudeGeometry Demo</h1>
        <p class="text-gray-300">Use the control panel to change the shape and its extrusion properties. Drag with the mouse to rotate the camera, scroll to zoom, and right-click to pan.</p>
    </div>

    <!-- We are using module scripts to import Three.js components -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.js';

        let scene, camera, renderer, controls, mesh, pathLine;
        const shapes = {};

        // Configuration object for GUI
        const config = {
            shape: 'Rounded Square',
            depth: 10,
            steps: 2,
            bevelEnabled: true,
            bevelThickness: 1,
            bevelSize: 1,
            bevelOffset: 0,
            bevelSegments: 8,
            extrudeAlongPath: false,
            showPath: false,
            wireframe: false,
            color: 0x156289
        };

        // Extrude path definition
        const extrudePath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-10, -5, 10),
            new THREE.Vector3(-5, 5, 5),
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(5, -5, 5),
            new THREE.Vector3(10, 0, 10)
        ]);

        function createShapes() {
            // Rounded Square
            const roundedRectShape = new THREE.Shape();
            (function roundedRect(ctx, x, y, width, height, radius) {
                ctx.moveTo(x, y + radius);
                ctx.lineTo(x, y + height - radius);
                ctx.quadraticCurveTo(x, y + height, x + radius, y + height);
                ctx.lineTo(x + width - radius, y + height);
                ctx.quadraticCurveTo(x + width, y + height, x + width, y + height - radius);
                ctx.lineTo(x + width, y + radius);
                ctx.quadraticCurveTo(x + width, y, x + width - radius, y);
                ctx.lineTo(x + radius, y);
                ctx.quadraticCurveTo(x, y, x, y + radius);
            })(roundedRectShape, 0, 0, 10, 10, 2);
            shapes['Rounded Square'] = roundedRectShape;

            // Shape with Hole
            const squareWithHole = new THREE.Shape();
            squareWithHole.moveTo(-5, -5);
            squareWithHole.lineTo(5, -5);
            squareWithHole.lineTo(5, 5);
            squareWithHole.lineTo(-5, 5);
            squareWithHole.lineTo(-5, -5);
            const holePath = new THREE.Path();
            holePath.moveTo(-2, -2);
            holePath.lineTo(2, -2);
            holePath.lineTo(2, 2);
            holePath.lineTo(-2, 2);
            holePath.lineTo(-2, -2);
            squareWithHole.holes.push(holePath);
            shapes['Square with Hole'] = squareWithHole;

            // Star Shape
            const starShape = new THREE.Shape();
            const outerRadius = 5;
            const innerRadius = 2.5;
            const numPoints = 5;
            starShape.moveTo(0, outerRadius);
            for (let i = 0; i < numPoints * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / numPoints;
                const x = radius * Math.sin(angle);
                const y = radius * Math.cos(angle);
                starShape.lineTo(x, y);
            }
            shapes['Star'] = starShape;

             // Fish Shape
            const fishShape = new THREE.Shape();
            fishShape.moveTo(0, 0);
            fishShape.quadraticCurveTo(5, 2.5, 10, 0);
            fishShape.quadraticCurveTo(12.5, -2.5, 10, -5);
            fishShape.quadraticCurveTo(12.5, -2.5, 15, -7.5);
            fishShape.quadraticCurveTo(10, -6, 10, -5);
            fishShape.quadraticCurveTo(5, -2.5, 0, 0);
            shapes['Curved Fish'] = fishShape;
        }

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            scene.fog = new THREE.Fog(0x111827, 50, 150);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 30);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Helper Grid
            const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x444444);
            scene.add(gridHelper);

            // Create shape definitions
            createShapes();

            // Create the line for the extrude path visualization
            const points = extrudePath.getPoints(50);
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff00ff });
            pathLine = new THREE.Line(lineGeometry, lineMaterial);
            pathLine.visible = config.showPath;
            scene.add(pathLine);

            // Initial geometry creation
            updateGeometry();
            
            // GUI
            setupGUI();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
        }

        function setupGUI() {
            const gui = new GUI();
            gui.title("Extrusion Controls");

            gui.add(config, 'shape', Object.keys(shapes)).name('Shape').onChange(updateGeometry);
            
            const folderExtrude = gui.addFolder('Extrude Settings');
            folderExtrude.add(config, 'depth', 1, 50, 1).name('Depth').onChange(updateGeometry);
            folderExtrude.add(config, 'steps', 1, 10, 1).name('Steps').onChange(updateGeometry);
            folderExtrude.add(config, 'extrudeAlongPath').name('Extrude on Path').onChange((value) => {
                if(value) config.showPath = true;
                pathLine.visible = config.showPath;
                updateGeometry();
            });
            folderExtrude.add(config, 'showPath').name('Show Path').onChange((value) => {
                pathLine.visible = value;
            });

            const folderBevel = gui.addFolder('Bevel Settings');
            folderBevel.add(config, 'bevelEnabled').name('Enable Bevel').onChange(updateGeometry);
            folderBevel.add(config, 'bevelThickness', 0.1, 5, 0.1).name('Thickness').onChange(updateGeometry);
            folderBevel.add(config, 'bevelSize', 0.1, 5, 0.1).name('Size').onChange(updateGeometry);
            folderBevel.add(config, 'bevelOffset', -5, 5, 0.1).name('Offset').onChange(updateGeometry);
            folderBevel.add(config, 'bevelSegments', 0, 20, 1).name('Segments').onChange(updateGeometry);
            
            const folderMaterial = gui.addFolder('Material');
            folderMaterial.addColor(config, 'color').name('Color').onChange(updateGeometry);
            folderMaterial.add(config, 'wireframe').name('Wireframe').onChange(updateGeometry);

            gui.open();
        }

        function updateGeometry() {
            if (mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            }

            const extrudeSettings = {
                steps: config.steps,
                depth: config.depth,
                bevelEnabled: config.bevelEnabled,
                bevelThickness: config.bevelThickness,
                bevelSize: config.bevelSize,
                bevelOffset: config.bevelOffset,
                bevelSegments: config.bevelSegments
            };

            if (config.extrudeAlongPath) {
                extrudeSettings.extrudePath = extrudePath;
                // When extruding along a path, 'depth' is ignored.
            }

            const geometry = new THREE.ExtrudeGeometry(shapes[config.shape], extrudeSettings);
            const material = new THREE.MeshStandardMaterial({
                color: config.color,
                metalness: 0.3,
                roughness: 0.6,
                side: THREE.DoubleSide,
                wireframe: config.wireframe
            });

            mesh = new THREE.Mesh(geometry, material);
            
            // Center the geometry
            geometry.center();

            scene.add(mesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Start the application
        init();
        animate();

    </script>
</body>
</html>
